[pytest]
# This directory is a member of the repository-root uv workspace, whose
# pyproject.toml sets global addopts (--doctest-modules, coverage, --failed-first)
# that do not apply here. A local config file makes this subproject's test run
# self-contained and reproducible.
testpaths = test
python_files = test_*.py
addopts = -ra --strict-markers --strict-config
filterwarnings =
    error::DeprecationWarning:optdsl_tooling.*
    error::DeprecationWarning:operator_synthesis.*
