[project]
name = "hybrid-solver"
version = "0.1.0"
description = "Hybrid OptDSL solver: MiniZinc exact backend + large neighborhood search with warm-start exchange"
readme = "README.md"
requires-python = "~=3.11.0"
dependencies = [
    "minizinc>=0.10.0,<0.11.0",
]

[project.optional-dependencies]
# Editor tooling. Kept optional so the solver itself stays dependency-light.
lsp = ["pygls>=2.1", "lsprotocol>=2023.0.1"]
# Full-screen terminal UI for the agent harness. Optional: the line REPL works
# without it, and the core harness must stay installable with only minizinc.
tui = ["textual>=0.80"]
dev = ["pytest>=8.0", "pygls>=2.1", "lsprotocol>=2023.0.1"]

[project.scripts]
optdsl-lsp = "optdsl_lsp.__main__:main"
optdsl-agent = "optdsl_agent.cli:main"

[tool.poetry]
package-mode = false
